apiVersion: apps/v1
kind: Deployment
metadata:
  name: majorproject-deployment
  namespace: production
  labels:
    app: majorproject
    tier: frontend
    managed-by: devopshub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: majorproject
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: majorproject
    spec:
      containers:
      - name: majorproject
        image: majorproject:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10